[project]
name = "OpenAgentLab"
version = "0.1.0"
description = "An open-source AI orchestration framework for building agentic applications and workflows."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

dependencies = [
    "alembic>=1.19.0",
    "asyncpg>=0.31.0",
    "fastapi",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[dependency-groups]
dev = [
    "black",
    "httpx",
    "pre-commit",
    "pytest",
    "ruff",
]


[tool.black]
line-length = 88
target-version = ["py312"]


[tool.ruff]
line-length = 88
target-version = "py312"


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]


[tool.hatch.build.targets.wheel]
packages = ["src/openagentlab"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["src"]
addopts = "-ra"
