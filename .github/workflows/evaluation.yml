name: Evaluation

on:
  pull_request:
    paths:
      - "src/openagentlab/agent/**"
      - "src/openagentlab/evaluation/**"
      - "src/openagentlab/rag/**"
      - "src/openagentlab/tools/**"
      - "tests/evaluation/**"
      - "tests/unit/evaluation/**"
      - "evaluation/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/evaluation.yml"
  push:
    branches: [main]
    paths:
      - "src/openagentlab/agent/**"
      - "src/openagentlab/evaluation/**"
      - "src/openagentlab/rag/**"
      - "src/openagentlab/tools/**"
      - "tests/evaluation/**"
      - "tests/unit/evaluation/**"
      - "evaluation/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/evaluation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dataset-validation:
    name: Dataset validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - run: mkdir -p evaluation-results
      - name: Validate smoke dataset
        run: uv run python -m openagentlab.evaluation validate --dataset evaluation/datasets/smoke.jsonl --tags smoke | tee evaluation-results/dataset-validation.json
      - name: Upload dataset validation result
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-dataset-validation
          path: evaluation-results/

  llm-evaluation:
    name: LLM evaluation smoke
    runs-on: ubuntu-latest
    needs: dataset-validation
    if: ${{ github.event_name == 'workflow_dispatch' }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev --group evaluation
      - run: mkdir -p evaluation-results
      - name: Skip when credentials are unavailable
        if: ${{ env.OPENAI_API_KEY == '' }}
        run: |
          printf '%s\n' '{"status":"skipped","reason":"OPENAI_API_KEY is not configured."}' > evaluation-results/llm-evaluation-skipped.json
      - name: Run DeepEval regression tests
        if: ${{ env.OPENAI_API_KEY != '' }}
        run: uv run pytest -m evaluation tests/evaluation -v --junitxml=evaluation-results/deepeval-junit.xml
      - name: Run Ragas smoke evaluation
        if: ${{ env.OPENAI_API_KEY != '' }}
        run: uv run python -m openagentlab.evaluation ragas --dataset evaluation/datasets/smoke.jsonl --tags smoke | tee evaluation-results/ragas-summary.json
      - name: Upload LLM evaluation results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llm-evaluation-results
          path: evaluation-results/
