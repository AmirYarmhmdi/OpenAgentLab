# File guide.
# Use: Configures Alembic database migrations.
# Usage: Alembic reads this file for script paths, database URL, and logging.
# Duties: Points migrations at the alembic folder and sets migration logging.
# Depends on: alembic/env.py and alembic/versions migration files.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# alembic/env.py injects this from DATABASE_URL at runtime.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
