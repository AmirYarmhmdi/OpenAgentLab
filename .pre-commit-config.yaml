# File guide.
# Use: Defines local pre-commit quality checks.
# Usage: pre-commit runs these hooks before commits when installed.
# Duties: Runs Ruff, Black, and pytest through uv.
# Depends on: pyproject.toml and the project test suite.

repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: uv run ruff check
        language: system
        types: [python]

      - id: black
        name: Black
        entry: uv run black --check
        language: system
        types: [python]

      - id: pytest
        name: Pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
